# Optional: local Postgres. Then set in backend/.env:
#   DATABASE_URL=postgresql+psycopg://tagalong:tagalong@localhost:5432/tagalong
# and `pip install "psycopg[binary]"` in the backend venv.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tagalong
      POSTGRES_PASSWORD: tagalong
      POSTGRES_DB: tagalong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
