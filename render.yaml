# Render blueprint: New > Blueprint > pick this repo. Fill the "sync: false" secrets in the dashboard.
services:
  - type: web
    name: saathigo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_NAME
        value: SaathiGo
      - key: FRONTEND_URL
        sync: false   # e.g. https://saathigo.onrender.com
      - key: BACKEND_URL
        sync: false   # same as FRONTEND_URL
      - key: CORS_ORIGINS
        sync: false   # e.g. ["https://saathigo.onrender.com"]
      - key: ADMIN_EMAILS
        value: admin@example.com
      - key: PAYMENT_PROVIDER
        value: mock   # set to pinelabs once PINELABS_* are filled
      - key: PINELABS_ENV
        value: uat
      - key: PINELABS_CLIENT_ID
        sync: false
      - key: PINELABS_CLIENT_SECRET
        sync: false
      - key: PINELABS_MERCHANT_ID
        sync: false
      - key: AGENT_PROVIDER
        value: agenticorg
      - key: AGENTICORG_API_KEY
        sync: false
